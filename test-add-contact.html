<!DOCTYPE html>
<html>
<head>
    <title>Test Add Contact</title>
</head>
<body>
    <h1>Test Add Contact Functionality</h1>
    
    <h2>Step 1: Click Add Contact Button</h2>
    <form action="http://localhost:8080/phonebook/contacts.xhtml" method="post">
        <input type="hidden" name="addContactForm" value="addContactForm" />
        <input type="hidden" name="javax.faces.ViewState" value="stateless" />
        <input type="hidden" name="javax.faces.source" value="addContactForm:addContactBtn" />
        <input type="hidden" name="javax.faces.partial.event" value="click" />
        <input type="hidden" name="javax.faces.partial.execute" value="addContactForm:addContactBtn" />
        <input type="hidden" name="javax.faces.partial.render" value="@all" />
        <input type="hidden" name="addContactForm:addContactBtn" value="addContactForm:addContactBtn" />
        <input type="submit" value="Click Add Contact Button" />
    </form>
    
    <h2>Step 2: Submit Add Contact Form</h2>
    <form action="http://localhost:8080/phonebook/contacts.xhtml" method="post">
        <input type="hidden" name="addForm" value="addForm" />
        <input type="hidden" name="javax.faces.ViewState" value="stateless" />
        
        <label>Name: <input type="text" name="addForm:addName" value="Test User" /></label><br/>
        <label>Phone: <input type="text" name="addForm:addPhone" value="123-456-7890" /></label><br/>
        <label>Email: <input type="text" name="addForm:addEmail" value="test@example.com" /></label><br/>
        
        <input type="hidden" name="javax.faces.source" value="addForm:j_idt39" />
        <input type="submit" name="addForm:j_idt39" value="Save Contact" />
    </form>
</body>
</html>
