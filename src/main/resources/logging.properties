# Logging configuration for ICEfaces Phone Book Application
# This configuration provides comprehensive logging for debugging and error tracking

# Global logging level
.level = INFO

# Console handler configuration
handlers = java.util.logging.ConsoleHandler, java.util.logging.FileHandler

# Console handler settings
java.util.logging.ConsoleHandler.level = INFO
java.util.logging.ConsoleHandler.formatter = java.util.logging.SimpleFormatter

# File handler settings
java.util.logging.FileHandler.level = ALL
java.util.logging.FileHandler.pattern = logs/phonebook-%u.log
java.util.logging.FileHandler.limit = 10485760
java.util.logging.FileHandler.count = 5
java.util.logging.FileHandler.append = true
java.util.logging.FileHandler.formatter = java.util.logging.SimpleFormatter

# Formatter settings
java.util.logging.SimpleFormatter.format = %1$tY-%1$tm-%1$td %1$tH:%1$tM:%1$tS %4$s %2$s %5$s%6$s%n

# Application-specific logging levels
com.phonebook.level = FINE
com.phonebook.bean.level = INFO
com.phonebook.service.level = INFO
com.phonebook.repository.level = INFO
com.phonebook.exception.level = INFO
com.phonebook.validation.level = INFO

# Third-party library logging levels
org.hibernate.level = WARN
org.hibernate.SQL.level = INFO
org.hibernate.type.descriptor.sql.BasicBinder.level = TRACE
org.icefaces.level = WARN
javax.faces.level = WARN
org.jboss.level = WARN

# Database logging
org.h2.level = WARN

# Root logger for uncategorized messages
org.level = WARN